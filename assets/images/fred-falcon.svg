<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgsuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7200" />
      <stop offset="100%" stop-color="#2c1605" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Shield -->
  <circle cx="100" cy="100" r="90" fill="url(#bgsuGrad)" stroke="#ff7200" stroke-width="6" filter="url(#shadow)" />
  <!-- BGSU Falcon Wings & Beak Silhouette -->
  <path d="M50 80 Q 100 40 150 80 Q 120 120 100 150 Q 80 120 50 80 Z" fill="#ffffff" opacity="0.95"/>
  <polygon points="100,85 125,60 100,110 75,60" fill="#ff7200"/>
  <text x="100" y="162" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">FRED FALCON</text>
</svg>
