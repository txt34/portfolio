<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="fordhamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a0322" />
      <stop offset="100%" stop-color="#580013" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Shield -->
  <circle cx="100" cy="100" r="90" fill="url(#fordhamGrad)" stroke="#ffffff" stroke-width="6" filter="url(#shadow)" />
  <!-- Fordham Ram Horns & Head Silhouette -->
  <path d="M60 110 C 40 80, 50 40, 90 45 C 110 48, 120 65, 115 80" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M140 110 C 160 80, 150 40, 110 45 C 90 48, 80 65, 85 80" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <polygon points="100,75 125,125 75,125" fill="#ffffff" opacity="0.95"/>
  <text x="100" y="162" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="2">RAMMY</text>
</svg>
